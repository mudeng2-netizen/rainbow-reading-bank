<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수학 미로 대탈출 - 큰 미로</title><style>body{margin:0;background:#f2f7ed;font-family:system-ui,'Malgun Gothic',sans-serif;color:#233b30;text-align:center}header{padding:12px 8px 5px}h1{margin:0;font-size:clamp(21px,4vw,30px)}#info{font-weight:800;margin:7px}#tip{font-size:13px;color:#53685a}canvas{display:block;width:min(94vw,650px);aspect-ratio:1;margin:10px auto;background:#e6f0d8;border:5px solid #55785e;border-radius:14px;image-rendering:auto}button{font:inherit;border:0;border-radius:12px;padding:10px 15px;background:#426d58;color:white;cursor:pointer;font-weight:750}#controls{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center;margin:10px}#controls button{font-size:23px;padding:8px;touch-action:manipulation}.blank{visibility:hidden}#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}#panel{background:white;padding:22px;border-radius:22px;max-width:390px;width:100%;box-shadow:0 12px 35px #0004}#prompt{font-size:20px;font-weight:800}#question{font-size:34px;font-weight:850;margin:15px}#answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#answers button{font-size:24px;background:#286b91}#feedback{min-height:26px;color:#a34d36;font-weight:750;margin:12px}#restart{background:#6c7989;margin-bottom:15px}#bar{max-width:640px;margin:6px auto;height:9px;background:#d7e1d2;border-radius:9px;overflow:hidden}#fill{height:100%;width:0;background:#5d9e6c;transition:width .2s}</style></head><body><header><h1>🗝️ 수학 미로 대탈출</h1><div id="info"></div><div id="bar"><div id="fill"></div></div><div id="tip">방향키나 아래 버튼으로 움직여요. 🚪 문 앞에서 문제를 풀어 보세요!</div></header><canvas id="maze" width="650" height="650" aria-label="수학 미로 지도"></canvas><div id="controls"><span class="blank">.</span><button onclick="move(0,-1)">▲</button><span class="blank">.</span><button onclick="move(-1,0)">◀</button><button onclick="move(0,1)">▼</button><button onclick="move(1,0)">▶</button></div><button id="restart" onclick="reset()">새 미로 시작하기</button><div id="modal"><div id="panel"><div id="prompt"></div><div id="question"></div><div id="answers"></div><div id="feedback"></div><button style="background:#788478" onclick="closeModal()">미로로 돌아가기</button></div></div><script>
const N=25,VIEW=13,T=50,GOAL_DOORS=28;const canvas=document.getElementById('maze'),ctx=canvas.getContext('2d');let grid,doors,opened,pos,exit,question,activeDoor,done,seenQuestions,attempts;
const key=(x,y)=>x+','+y,rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function generate(){grid=Array.from({length:N},()=>Array(N).fill('#'));let stack=[[1,1]];grid[1][1]='.';while(stack.length){let [x,y]=stack[stack.length-1],dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-.5),next=dirs.find(([dx,dy])=>x+dx>0&&x+dx<N-1&&y+dy>0&&y+dy<N-1&&grid[y+dy][x+dx]==='#');if(!next){stack.pop();continue}let [dx,dy]=next;grid[y+dy/2][x+dx/2]='.';grid[y+dy][x+dx]='.';stack.push([x+dx,y+dy])}let parent=new Map(),queue=[[1,1]],visited=new Set([key(1,1)]),far=[1,1];for(let i=0;i<queue.length;i++){let [x,y]=queue[i];far=[x,y];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,k=key(nx,ny);if(grid[ny]?.[nx]==='.'&&!visited.has(k)){visited.add(k);parent.set(k,[x,y]);queue.push([nx,ny])}}}exit={x:far[0],y:far[1]};let path=[far];while(key(...path[path.length-1])!==key(1,1))path.push(parent.get(key(...path[path.length-1])));path.reverse();let count=Math.min(GOAL_DOORS,Math.max(1,Math.floor((path.length-5)/2)));doors=new Set();for(let i=1;i<=count;i++){let idx=Math.round(i*(path.length-2)/(count+1));let [x,y]=path[idx];doors.add(key(x,y))}return path.length}
function reset(){generate();opened=new Set();seenQuestions=new Set();attempts=0;pos={x:1,y:1};done=false;closeModal();draw()}
function draw(){ctx.clearRect(0,0,650,650);let ox=Math.max(0,Math.min(N-VIEW,pos.x-Math.floor(VIEW/2))),oy=Math.max(0,Math.min(N-VIEW,pos.y-Math.floor(VIEW/2)));for(let yy=0;yy<VIEW;yy++)for(let xx=0;xx<VIEW;xx++){let x=ox+xx,y=oy+yy,k=key(x,y),wall=grid[y][x]==='#';ctx.fillStyle=wall?'#648b75':(x+y)%2?'#f6e9c8':'#f0dfb9';ctx.fillRect(xx*T,yy*T,T,T);ctx.strokeStyle='#ffffff28';ctx.strokeRect(xx*T,yy*T,T,T);if(doors.has(k)&&!opened.has(k)){ctx.fillStyle='#aa693e';ctx.fillRect(xx*T+7,yy*T+3,36,44);ctx.fillStyle='#ffe071';ctx.beginPath();ctx.arc(xx*T+32,yy*T+26,4,0,Math.PI*2);ctx.fill()}if(x===exit.x&&y===exit.y){ctx.font='32px serif';ctx.fillText('🏆',xx*T+7,yy*T+37)}}ctx.font='36px serif';ctx.fillText('🧒',(pos.x-ox)*T+6,(pos.y-oy)*T+39);document.getElementById('info').textContent=`🚪 열린 문 ${opened.size} / ${doors.size}개  ·  ⭐ ${opened.size}개  ·  도전 ${attempts}회`;document.getElementById('fill').style.width=(100*opened.size/doors.size)+'%'}
function move(dx,dy){if(done||document.getElementById('modal').style.display==='flex')return;let x=pos.x+dx,y=pos.y+dy,k=key(x,y);if(grid[y]?.[x]!=='.')return;if(doors.has(k)&&!opened.has(k)){activeDoor={x,y};ask();return}pos={x,y};draw();if(x===exit.x&&y===exit.y)finish()}
function makeQuestion(){let a,b,c,answer,expression;let type=rand(0,3);if(type===0){a=rand(2,9);b=rand(2,10);answer=a+b;expression=`${a} + ${b}`}else if(type===1){a=rand(10,19);b=rand(2,9);answer=a-b;expression=`${a} − ${b}`}else if(type===2){a=rand(2,8);b=rand(2,8);c=rand(1,a+b);answer=a+b-c;expression=`${a} + ${b} − ${c}`}else{a=rand(12,19);b=rand(2,Math.min(9,a-2));c=rand(1,Math.min(8,20-(a-b)));answer=a-b+c;expression=`${a} − ${b} + ${c}`}return{expression,answer}}
function ask(){let tries=0;do{question=makeQuestion();tries++}while(seenQuestions.has(question.expression)&&tries<300);seenQuestions.add(question.expression);document.getElementById('modal').style.display='flex';document.getElementById('prompt').textContent='🚪 계산해서 문을 열어요!';document.getElementById('question').textContent=question.expression+' = ?';document.getElementById('feedback').textContent='';let options=new Set([question.answer]);while(options.size<3){let n=question.answer+rand(-5,5);if(n>=0&&n<=20)options.add(n)}let shuffled=[...options].sort(()=>Math.random()-.5),box=document.getElementById('answers');box.innerHTML='';for(let v of shuffled){let b=document.createElement('button');b.textContent=v;b.onclick=()=>check(v);box.appendChild(b)}}
function check(v){attempts++;if(v!==question.answer){document.getElementById('feedback').textContent='다시 계산해 볼까요? 😊';return}opened.add(key(activeDoor.x,activeDoor.y));pos={...activeDoor};closeModal();draw()}
function closeModal(){document.getElementById('modal').style.display='none'}
function finish(){done=true;document.getElementById('modal').style.display='flex';document.getElementById('prompt').textContent='🎉 미로 탈출 성공!';document.getElementById('question').textContent=`⭐ ${opened.size}문제 해결!`;document.getElementById('answers').innerHTML='<button style="grid-column:1/4" onclick="reset()">새 미로 도전하기</button>';document.getElementById('feedback').textContent=`총 ${attempts}번 답을 선택했어요. 멋진 탐험이었어요!`}
document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});reset();
</script></body></html>
